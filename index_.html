<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohavei Tsion</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="zmanim.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap');
    :root { --bg-deep-blue: #0f34a1; --gold-border: #f1c40f; --card-blue: rgba(255, 255, 255, 0.08); }
    body { font-family: 'Assistant', sans-serif; background-color: var(--bg-deep-blue); color: white; padding: 10px; display: flex; justify-content: center; margin: 0; }
    
    #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-deep-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.6s ease-out; }
    .loader-line { width: 150px; height: 3px; background: rgba(255,255,255,0.1); margin-top: 20px; position: relative; overflow: hidden; border-radius: 2px; }
    .loader-line::after { content: ""; position: absolute; left: -100%; width: 100%; height: 100%; background: var(--gold-border); animation: loadingBar 1.5s infinite ease-in-out; }
    @keyframes loadingBar { 0% { left: -100%; } 50% { left: 0%; } 100% { left: 100%; } }
    .loaded #splash-screen { opacity: 0; pointer-events: none; }

    .main-container { border: 3px solid var(--gold-border); border-radius: 20px; min-height: calc(100vh - 20px); padding: 15px; width: 100%; max-width: 500px; background: linear-gradient(to bottom, #0f34a1, #0a2472); opacity: 0; transform: scale(0.98); transition: opacity 0.8s ease, transform 0.8s ease; display: flex; flex-direction: column; }
    .loaded .main-container { opacity: 1; transform: scale(1); }

    /* Liens du haut */
    .link-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
    .mini-link { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-decoration: none; color: white; font-size: 0.8rem; font-weight: 600; }

    /* BOUTON INSTALLATION DÉDIÉ */
    .install-banner {
        background: linear-gradient(90deg, #f1c40f, #d4ac0d);
        color: #0f34a1;
        padding: 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: transform 0.2s;
    }
    .install-banner:active { transform: scale(0.97); }

    .zman-box { background: white; border-radius: 12px; color: #0f34a1; padding: 10px 5px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .annonce-card { background: var(--card-blue); border: 1px solid rgba(255,255,255,0.15); border-radius: 15px; padding: 45px 15px 15px 15px; margin-bottom: 15px; display: none; position: relative; text-align: center; }
    .section-card { border: 1px solid rgba(255,255,255,0.15); border-radius: 15px; padding: 15px; background: var(--card-blue); margin-bottom: 8px; }
    .section-title { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; text-align: center; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; }
    .title-underline { width: 40px; height: 3px; background-color: var(--gold-border); margin-top: 4px; border-radius: 2px; }
    .row-major { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; }
    .f-bold { font-weight: 800 !important; }
    .f-red { color: #ff4d4d !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://ohavei-tsion.org/wp-content/uploads/2019/04/cropped-ohavei-logo-1.png" class="h-20 w-auto rounded bg-white p-2">
        <div class="loader-line"></div>
    </div>

    <div class="main-container shadow-2xl">
        <div class="flex items-center mb-4 border-b border-white/10 pb-3">
            <div class="w-1/3 flex justify-center"><img src="https://ohavei-tsion.org/wp-content/uploads/2019/04/cropped-ohavei-logo-1.png" class="h-10 w-auto rounded bg-white p-1"></div>
            <div class="w-2/3"><h1 class="text-xl font-black italic text-white uppercase leading-tight">Ohavei Tsion</h1></div>
        </div>

        <div class="link-bar">
            <a href="https://ohaveitsion.github.io/Jerusalem/Maftir.html" target="_blank" class="mini-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                Maftir
            </a>
            <a href="https://gregysite.github.io/Tehilim" target="_blank" class="mini-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.84-8.84 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                Tehilim
            </a>
        </div>

        <div id="install-banner" class="install-banner">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Installer l'Application
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="zman-box">
                <p class="text-[10px] font-bold uppercase opacity-60 mb-1">Shabbat</p>
                <p id="shabbat-name" class="text-lg font-bold leading-tight">--</p>
            </div>
            <div class="zman-box">
                <p id="label-allumage_bougies" class="text-[10px] font-bold uppercase text-red-500 mb-1">Allumage</p>
                <p id="sheet-allumage_bougies" class="text-2xl font-bold text-red-600">--:--</p>
            </div>
        </div>

        <div id="announcement-block" class="annonce-card">
            <span id="sheet-annonce_titre" class="annonce-titre-style" style="position:absolute; top:12px; left:15px; font-size:0.75rem; opacity:0.6;"></span>
            <div id="sheet-annonce_texte" class="text-xl mt-2 font-bold"></div>
            <div class="title-underline mx-auto mt-3"></div>
        </div>

        <div id="extra-sections-container"></div>

        <div class="section-card">
            <div class="section-title">SHABBAT<div class="title-underline"></div></div>
            <div class="space-y-1">
                <div class="row-major"><span>Minha Vendredi</span><span id="sheet-minha_vendredi" class="text-xl font-bold">--:--</span></div>
                <div class="row-major border-t border-white/10 pt-1"><span>Shaharit</span><span id="sheet-chaharit_shabbat" class="text-xl font-bold">--:--</span></div>
                <div class="row-major border-t border-white/10 pt-1"><span>Minha / Seouda</span><span id="sheet-minha_shabbat" class="text-xl font-bold">--:--</span></div>
                <div class="row-major border-t border-white/10 pt-1"><span>Arvit Motsae</span><span id="sheet-arvit_motsach" class="text-xl font-bold">--:--</span></div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">SEMAINE<div class="title-underline"></div></div>
            <div class="space-y-1">
                <div class="row-major"><span>Shaharit</span><span id="sheet-chaharit_semaine" class="text-xl font-bold">--:--</span></div>
                <div class="row-major border-t border-white/10 pt-1"><span>Minha / Arvit</span><span id="sheet-minha_semaine" class="text-xl font-bold">--:--</span></div>
            </div>
        </div>

        <div class="w-full text-center mt-auto pt-6 pb-2 text-xs opacity-50">© Greg u.</div>
    </div>

    <script>
        const API_URL = "https://api-syna.gregyman.workers.dev/";

        // LOGIQUE D'INSTALLATION
        let deferredPrompt;
        const installBtn = document.getElementById('install-banner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Sur Android, on peut faire clignoter le bouton pour attirer l'attention
            installBtn.style.border = "2px solid white";
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                }
            } else {
                // Détection iOS ou Navigateur sans prompt
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    alert("INSTALLATION IPHONE :\n\n1. Cliquez sur l'icône 'Partager' (le carré avec une flèche) en bas de Safari.\n2. Faites défiler et cliquez sur 'Sur l'écran d'accueil'.");
                } else {
                    alert("Pour installer cette application sur votre écran d'accueil, utilisez le menu de votre navigateur (les 3 points en haut à droite) et sélectionnez 'Installer l'application'.");
                }
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        }

        // CHARGEMENT DES DONNÉES
        function format(t) { 
            if(!t) return "";
            return t.replace(/<[^>]*>/g, "").replace(/\*\*(.*?)\*\*/g, '<span class="f-bold">$1</span>').replace(/\n/g, "<br>");
        }

        async function loadAll() {
            try {
                const sheetRes = await fetch(API_URL);
                const sData = await sheetRes.json();
                
                // Remplissage simplifié pour l'exemple
                document.getElementById('shabbat-name').innerText = sData.parasha?.valeur || "Chargement...";
                document.getElementById('sheet-allumage_bougies').innerText = sData.allumage_bougies?.valeur || "--:--";
                
                // (Ajouter ici le reste de ta logique de boucle pour les autres IDs)
                
                document.body.classList.add('loaded');
            } catch(e) { 
                document.body.classList.add('loaded'); 
            }
        }
        loadAll();
    </script>
</body>
</html>
