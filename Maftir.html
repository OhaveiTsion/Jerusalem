<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision Maftir - Jérusalem</title>
    <style>
        :root { --primary: #2c3e50; --accent: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; direction: rtl; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; direction: ltr; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; direction: ltr; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        select, .btn { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; }
        .btn.active { background: var(--primary); color: white; }
        .hebrew-text { font-size: 28px; line-height: 2; margin-top: 15px; text-align: right; font-family: "Times New Roman", serif; }
        .audio-player { background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; direction: ltr; }
        audio { width: 100%; }
        .hidden { display: none; }
        h2 { color: var(--accent); border-bottom: 2px solid #eee; padding-bottom: 5px; direction: ltr; text-align: right; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="display-title">Chargement...</h1>
</div>

<div class="container">
    <div class="controls-row">
        <select id="parasha-select" onchange="manualSelect()">
            <option value="">-- Sélectionner --</option>
        </select>
        <div style="display:flex; align-items:center; gap:8px;">
            <span>H'oul</span>
            <label class="switch">
                <input type="checkbox" id="israel-toggle" checked onchange="initWeek()">
                <span class="slider"></span>
            </label>
            <span>Israël</span>
        </div>
        <button id="mode-btn" class="btn" onclick="toggleStam()">Mode Torah</button>
    </div>

    <div class="audio-player">
        <div id="audio-status">Recherche audio...</div>
        <audio id="audio-ctrl" controls class="hidden"></audio>
    </div>

    <div id="loader" style="text-align:center; padding: 20px;">Synchronisation Sefaria...</div>
    
    <div id="content" class="hidden">
        <div id="maftir-section">
            <h2>Maftir</h2>
            <div id="maftir-text" class="hebrew-text"></div>
        </div>
        <div id="haftara-section" style="margin-top:40px;">
            <h2>Haftara</h2>
            <div id="haftara-text" class="hebrew-text"></div>
        </div>
    </div>
</div>

<script>
    const torahBooks = {
        "Bereshit (Genèse)": ["Bereshit", "Noach", "Lech-Lecha", "Vayera", "Chayei Sara", "Toldot", "Vayetzei", "Vayishlach", "Vayeshev", "Miketz", "Vayigash", "Vayechi"],
        "Shemot (Exode)": ["Shemot", "Vaera", "Bo", "Beshalach", "Yitro", "Mishpatim", "Terumah", "Tetzaveh", "Ki Tissa", "Vayakhel", "Pekudei"],
        "Vayikra (Lévitique)": ["Vayikra", "Tzav", "Shmini", "Tazria", "Metzora", "Achrei Mot", "Kedoshim", "Emor", "Behar", "Bechukotai"],
        "Bemidbar (Nombres)": ["Bemidbar", "Nasso", "Beha'alotcha", "Shelach", "Korach", "Chukat", "Balak", "Pinchas", "Matot", "Masei"],
        "Devarim (Deutéronome)": ["Devarim", "Vaetchanan", "Eikev", "Re'eh", "Shoftim", "Ki Teitzei", "Ki Tavo", "Nitzavim", "Vayeilech", "Ha'Azinu", "V'Zot HaBerachah"]
    };

    const nameMap = {
        "Bereshit": "Bereshit", "Noach": "Noah", "Lech-Lecha": "Leh-Leha", "Vayera": "Vayera",
        "Chayei Sara": "Hayei Sara", "Toldot": "Toldot", "Vayetzei": "Vayetzei", "Vayishlach": "Vayishlah",
        "Vayeshev": "Vayeshev", "Miketz": "Miketz", "Vayigash": "Vayigash", "Vayechi": "Vayehi",
        "Shemot": "Shemot", "Vaera": "Vaera", "Bo": "Bo", "Beshalach": "Beshalah", "Yitro": "Yitro",
        "Mishpatim": "Mishpatim", "Terumah": "Terumah", "Tetzaveh": "Tetzaveh", "Ki Tissa": "Ki Tissa",
        "Vayakhel": "Vayakhel", "Pekudei": "Pekudei", "Vayikra": "Vayikra", "Tzav": "Tzav",
        "Shmini": "Shmini", "Tazria": "Tazria", "Metzora": "Metzora", "Achrei Mot": "Ahrei Mot",
        "Kedoshim": "Kedoshim", "Emor": "Emor", "Behar": "Behar", "Bechukotai": "Behoukotai",
        "Bemidbar": "Bemidbar", "Nasso": "Nasso", "Beha'alotcha": "Behaalotha", "Shelach": "Shelah",
        "Korach": "Korah", "Chukat": "Houkat", "Balak": "Balak", "Pinchas": "Pinhas", "Matot": "Matot",
        "Masei": "Masei", "Devarim": "Devarim", "Vaetchanan": "Vaethanan", "Eikev": "Eikev",
        "Re'eh": "Reeh", "Shoftim": "Shoftim", "Ki Teitzei": "Ki-Teitzei", "Ki Tavo": "Ki-Tavo",
        "Nitzavim": "Nitzavim", "Vayeilech": "Vayeilech", "Ha'Azinu": "Haazinou", "V'Zot HaBerachah": "Vezot-Haberaha"
    };

    let isStam = false;
    let currentEnName = "";
    const audioPath = "https://ohaveitsion.github.io/Jerusalem/Audios/";

    const select = document.getElementById('parasha-select');
    for (const [book, parashiot] of Object.entries(torahBooks)) {
        let group = document.createElement('optgroup');
        group.label = book;
        parashiot.forEach(en => {
            let opt = document.createElement('option');
            opt.value = en;
            opt.text = nameMap[en];
            group.appendChild(opt);
        });
        select.add(group);
    }

    async function initWeek() {
        const isIsrael = document.getElementById('israel-toggle').checked;
        try {
            const res = await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&israel=${isIsrael?'on':'off'}&maj=on&year=now&month=now`);
            const data = await res.json();
            const p = data.items.find(i => i.category === "parashat");
            if(p) {
                currentEnName = p.title.replace("Parashat ", "");
                document.getElementById('parasha-select').value = currentEnName;
                loadData(currentEnName);
            }
        } catch (e) { console.error(e); }
    }

    function manualSelect() {
        const sel = document.getElementById('parasha-select').value;
        if(sel) loadData(sel);
    }

    async function loadData(enName) {
        currentEnName = enName;
        const frName = nameMap[enName] || enName;
        document.getElementById('display-title').innerText = "Parashat " + frName;
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('content').classList.add('hidden');

        try {
            const cal = await fetch(`https://www.sefaria.org/api/calendars?timezone=Asia/Jerusalem`).then(r => r.json());
            const parashaObj = cal.calendar_items.find(i => i.title.en.includes(enName));
            
            // Logique de Maftir dynamique : on prend les 3 derniers versets de la 7ème montée par défaut
            let rawRef = parashaObj ? parashaObj.extraDetails.aliyah[6] : enName;
            let maftirRef = rawRef;
            
            if (rawRef.includes("-")) {
                const parts = rawRef.split("-");
                const startRef = parts[0];
                const endRef = parts[1];
                const chapter = startRef.split(":")[0];
                const endVerse = parseInt(endRef.includes(":") ? endRef.split(":")[1] : endRef);
                const startVerse = Math.max(1, endVerse - 2); // Affiche 3 versets
                maftirRef = `${chapter}:${startVerse}-${endVerse}`;
            }

            const haftaraRef = parashaObj ? parashaObj.subs[0] : null;

            const [mRes, hRes] = await Promise.all([
                fetch(`https://www.sefaria.org/api/texts/${maftirRef}?context=0`).then(r => r.json()),
                haftaraRef ? fetch(`https://www.sefaria.org/api/texts/${haftaraRef}?context=0`).then(r => r.json()) : null
            ]);

            display(mRes.he, hRes ? hRes.he : null);
            checkAudio(frName);
        } catch (e) { 
            document.getElementById('loader').innerText = "Erreur de chargement.";
        }
    }

    function display(m, h) {
        const clean = (t) => {
            if (!t) return "";
            let txt = Array.isArray(t) ? t.join(' ') : t;
            if(isStam) txt = txt.replace(/[\u0591-\u05C7]/g, ""); 
            return txt;
        };
        document.getElementById('maftir-text').innerHTML = clean(m);
        if (h) {
            document.getElementById('haftara-section').classList.remove('hidden');
            document.getElementById('haftara-text').innerHTML = clean(h);
        } else {
            document.getElementById('haftara-section').classList.add('hidden');
        }
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
    }

    function checkAudio(name) {
        const ctrl = document.getElementById('audio-ctrl');
        const status = document.getElementById('audio-status');
        const urlMp3 = `${audioPath}${encodeURIComponent(name)}.mp3`;
        ctrl.classList.add('hidden');
        status.innerText = "Recherche audio...";
        const test = new Audio(urlMp3);
        
        test.addEventListener('canplaythrough', () => {
            ctrl.src = urlMp3;
            ctrl.classList.remove('hidden');
            status.classList.add('hidden');
        }, { once: true });
        
        test.addEventListener('error', () => { 
            status.innerText = "Audio a venir ..."; 
        }, { once: true });
    }

    function toggleStam() {
        isStam = !isStam;
        document.getElementById('mode-btn').classList.toggle('active');
        if(currentEnName) loadData(currentEnName);
    }

    // Exécution immédiate
    initWeek();
</script>
</body>
</html>
