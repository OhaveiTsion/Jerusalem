<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision Maftir & Haftara - Jérusalem</title>
    <style>
        :root { --primary: #2c3e50; --accent: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; direction: rtl; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; direction: ltr; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; direction: ltr; }
        .btn { padding: 10px 20px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; background: white; }
        .btn.active { background: var(--primary); color: white; }
        select { padding: 10px; border-radius: 5px; font-size: 16px; width: 250px; }
        .hebrew-text { font-size: 28px; line-height: 2; margin-top: 15px; text-align: right; font-family: "Times New Roman", serif; white-space: pre-wrap; }
        .audio-player { background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; direction: ltr; }
        .hidden { display: none; }
        h2 { direction: ltr; text-align: right; color: var(--accent); border-bottom: 2px solid #eee; }
        .loader-spinner { text-align: center; color: #7f8c8d; font-style: italic; direction: ltr; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="display-title">Révision Maftir</h1>
</div>

<div class="container">
    <div class="controls-row">
        <select id="parasha-select" onchange="manualSelect()">
            <option value="">-- Choisir une Parasha --</option>
        </select>
        <button id="mode-btn" class="btn" onclick="toggleStam()">Mode Torah</button>
    </div>

    <div id="audio-zone" class="audio-player hidden">
        <audio id="audio-ctrl" controls></audio>
        <div id="audio-status" style="margin-top:5px; font-size:14px; color:#666;"></div>
    </div>

    <div id="loader" class="loader-spinner hidden">Chargement des textes sacrés...</div>

    <div id="content" class="hidden">
        <div id="maftir-section">
            <h2 id="maftir-ref-title">Maftir</h2>
            <div id="maftir-text" class="hebrew-text"></div>
        </div>
        <div id="haftara-section" style="margin-top:40px;">
            <h2 id="haftara-ref-title">Haftara</h2>
            <div id="haftara-text" class="hebrew-text"></div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const audioBase = "https://ohaveitsion.github.io/Jerusalem/Audios/";
    let isStam = false;
    let currentParasha = "";

    // Mapping Maftir (Fixe car ne change jamais contrairement à la Haftara)
    const maftirRefs = {
        "Bereshit": "Genesis 6:5-6:8", "Noach": "Genesis 11:29-11:32", "Lech-Lecha": "Genesis 17:24-17:27", "Vayera": "Genesis 22:20-22:24", "Chayei Sara": "Genesis 25:16-25:18", "Toldot": "Genesis 28:5-28:9", "Vayetzei": "Genesis 31:55-32:3", "Vayishlach": "Genesis 36:40-36:43", "Vayeshev": "Genesis 40:20-40:23", "Miketz": "Genesis 44:14-44:17", "Vayigash": "Genesis 47:24-47:27", "Vayechi": "Genesis 50:23-50:26",
        "Shemot": "Exodus 5:22-6:1", "Vaera": "Exodus 9:30-9:35", "Bo": "Exodus 13:14-13:16", "Beshalach": "Exodus 17:14-17:16", "Yitro": "Exodus 20:19-20:23", "Mishpatim": "Exodus 24:15-24:18", "Terumah": "Exodus 27:17-27:19", "Tetzaveh": "Exodus 30:8-30:10", "Ki Tissa": "Exodus 34:30-34:35", "Vayakhel": "Exodus 38:18-38:20", "Pekudei": "Exodus 40:34-40:38",
        "Vayikra": "Leviticus 5:24-5:26", "Tzav": "Leviticus 8:33-8:36", "Shmini": "Leviticus 11:44-11:47", "Tazria": "Leviticus 13:57-13:59", "Metzora": "Leviticus 15:31-15:33", "Achrei Mot": "Leviticus 18:24-18:30", "Kedoshim": "Leviticus 20:25-20:27", "Emor": "Leviticus 24:21-24:23", "Behar": "Leviticus 25:53-26:2", "Bechukotai": "Leviticus 27:32-27:34",
        "Bemidbar": "Numbers 4:17-4:20", "Nasso": "Numbers 7:87-7:89", "Beha'alotcha": "Numbers 12:14-12:16", "Shelach": "Numbers 15:37-15:41", "Korach": "Numbers 18:30-18:32", "Chukat": "Numbers 21:34-22:1", "Balak": "Numbers 25:7-25:9", "Pinchas": "Numbers 29:35-30:1", "Matot": "Numbers 32:39-32:42", "Masei": "Numbers 36:10-36:13",
        "Devarim": "Deuteronomy 3:18-3:22", "Vaetchanan": "Deuteronomy 7:7-7:11", "Eikev": "Deuteronomy 11:22-11:25", "Re'eh": "Deuteronomy 16:13-16:17", "Shoftim": "Deuteronomy 21:7-21:9", "Ki Teitzei": "Deuteronomy 25:17-25:19", "Ki Tavo": "Deuteronomy 29:6-29:8", "Nitzavim": "Deuteronomy 30:15-30:20", "Vayeilech": "Deuteronomy 31:28-31:30", "Ha'Azinu": "Deuteronomy 32:48-32:52", "V'Zot HaBerachah": "Deuteronomy 34:10-34:12"
    };

    // Liste ordonnée pour le menu
    const parashiotList = ["Bereshit", "Noach", "Lech-Lecha", "Vayera", "Chayei Sara", "Toldot", "Vayetzei", "Vayishlach", "Vayeshev", "Miketz", "Vayigash", "Vayechi", "Shemot", "Vaera", "Bo", "Beshalach", "Yitro", "Mishpatim", "Terumah", "Tetzaveh", "Ki Tissa", "Vayakhel", "Pekudei", "Vayikra", "Tzav", "Shmini", "Tazria", "Metzora", "Achrei Mot", "Kedoshim", "Emor", "Behar", "Bechukotai", "Bemidbar", "Nasso", "Beha'alotcha", "Shelach", "Korach", "Chukat", "Balak", "Pinchas", "Matot", "Masei", "Devarim", "Vaetchanan", "Eikev", "Re'eh", "Shoftim", "Ki Teitzei", "Ki Tavo", "Nitzavim", "Vayeilech", "Ha'Azinu", "V'Zot HaBerachah"];

    function init() {
        const sel = document.getElementById('parasha-select');
        parashiotList.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p;
            opt.text = p;
            sel.add(opt);
        });
    }

    async function loadTexts(pName) {
        currentParasha = pName;
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');
        
        loader.classList.remove('hidden');
        content.classList.add('hidden');

        try {
            // 1. Récupérer la référence de la Haftarah via le calendrier Sefaria
            // On cherche la parasha spécifique. Sefaria accepte le nom direct.
            const calUrl = `https://www.sefaria.org/api/calendars?parasha=${pName}`;
            const calRes = await fetch(calUrl).then(r => r.json());
            
            // On cherche l'item "Haftarah" dans le calendrier
            const hItem = calRes.calendar_items.find(i => i.title.en === "Haftarah" || i.title.en.includes("Haftara"));
            const hRef = hItem ? hItem.ref : null;
            const mRef = maftirRefs[pName];

            // 2. Récupérer les textes hébreux
            const [mTextData, hTextData] = await Promise.all([
                fetch(`https://www.sefaria.org/api/texts/${mRef}?context=0`).then(r => r.json()),
                hRef ? fetch(`https://www.sefaria.org/api/texts/${hRef}?context=0`).then(r => r.json()) : {he: "Référence Haftara non trouvée."}
            ]);

            // Mise à jour de l'interface
            document.getElementById('maftir-ref-title').innerText = `Maftir (${mRef})`;
            document.getElementById('haftara-ref-title').innerText = `Haftara (${hRef || '?'})`;
            
            render(mTextData.he, hTextData.he);
            handleAudio(pName);

        } catch (err) {
            console.error(err);
            loader.innerText = "Erreur lors de la récupération des données.";
        }
    }

    function render(mHe, hHe) {
        const clean = (input) => {
            if (!input) return "";
            // Gère les tableaux de textes (Sefaria renvoie parfois des tableaux imbriqués)
            let txt = Array.isArray(input) ? input.flat(Infinity).join(' ') : input;
            // Mode Stam (enlève les voyelles et signes de cantillation)
            if (isStam) {
                txt = txt.replace(/[\u0591-\u05C7]/g, "");
            }
            return txt;
        };

        document.getElementById('maftir-text').innerHTML = clean(mHe);
        document.getElementById('haftara-text').innerHTML = clean(hHe);
        
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
    }

    function handleAudio(name) {
        const zone = document.getElementById('audio-zone');
        const ctrl = document.getElementById('audio-ctrl');
        const status = document.getElementById('audio-status');
        const url = `${audioBase}${encodeURIComponent(name)}.mp3`;

        zone.classList.remove('hidden');
        status.innerText = "Vérification de l'audio...";
        ctrl.classList.add('hidden');

        fetch(url, { method: 'HEAD' }).then(res => {
            if (res.ok) {
                ctrl.src = url;
                ctrl.classList.remove('hidden');
                status.innerText = "Audio disponible";
            } else {
                status.innerText = "Pas d'audio enregistré pour cette Parasha.";
            }
        }).catch(() => { status.innerText = "Erreur de chargement audio."; });
    }

    function manualSelect() {
        const val = document.getElementById('parasha-select').value;
        if (val) loadTexts(val);
    }

    function toggleStam() {
        isStam = !isStam;
        document.getElementById('mode-btn').classList.toggle('active');
        if (currentParasha) loadTexts(currentParasha);
    }

    window.onload = init;
</script>

</body>
</html>
