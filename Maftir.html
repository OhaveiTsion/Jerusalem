<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232c3e50'/%3E%3Cpath d='M30 20v60M70 20v60' stroke='%23d4af37' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M30 30h40M30 70h40' stroke='%23d4af37' stroke-width='12'/%3E%3C/svg%3E">
    <title>Maftir & Haftara</title>
    <style>
        :root { --primary: #2c3e50; --accent: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; position: relative; }
        
        /* Sélecteur de langue */
        .lang-switch { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); display: flex; gap: 5px; }
        .lang-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .lang-btn.active { background: white; color: var(--primary); font-weight: bold; }

        .container { max-width: 900px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex-grow: 1; }
        
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 25px; margin-bottom: 30px; direction: ltr; }
        select { padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; min-width: 250px; cursor: pointer; background: #fff; }
        optgroup { font-weight: bold; color: var(--primary); background: #f9f9f9; }
        
        .btn { padding: 12px 20px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; background: white; transition: 0.3s; }
        .btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .switch-container { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #555; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }

        .audio-player { background: #fdfdfd; border: 2px solid #eee; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 30px; direction: ltr; }
        audio { width: 100%; height: 50px; }
        #audio-status { margin-top: 10px; font-size: 14px; font-weight: 500; color: #666; }

        .hebrew-text { font-size: 32px; line-height: 2.2; margin-top: 20px; text-align: right; font-family: "Times New Roman", serif; white-space: pre-wrap; direction: rtl; }
        .hidden { display: none; }
        h2 { text-align: right; color: var(--accent); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-top: 40px; direction: ltr; }
        .loader-spinner { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }

        footer { text-align: center; padding: 20px; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

<div class="header">
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('fr')">FR</button>
        <button class="lang-btn" onclick="setLanguage('he')">עב</button>
    </div>
    <h1 id="ui-title">Maftir & Haftara</h1>
</div>

<div class="container">
    <div class="controls-row">
        <select id="parasha-select" onchange="manualSelect()">
            <option value="" id="ui-select-placeholder">-- Sélectionner une Parasha --</option>
        </select>

        <div class="switch-container">
            <span id="ui-houl">H'oul</span>
            <label class="switch">
                <input type="checkbox" id="israel-toggle" checked onchange="manualSelect()">
                <span class="slider"></span>
            </label>
            <span id="ui-israel">Israël</span>
        </div>

        <button id="mode-btn" class="btn" onclick="toggleStam()">Mode Torah</button>
    </div>

    <div id="audio-zone" class="audio-player hidden">
        <audio id="audio-ctrl" controls controlsList="nodownload"></audio>
        <div id="audio-status"></div>
    </div>

    <div id="loader" class="loader-spinner hidden"></div>

    <div id="content" class="hidden">
        <div id="maftir-section">
            <h2 id="maftir-ref-title">Maftir</h2>
            <div id="maftir-text" class="hebrew-text"></div>
        </div>
        <div id="haftara-section">
            <h2 id="haftara-ref-title">Haftara</h2>
            <div id="haftara-text" class="hebrew-text"></div>
        </div>
    </div>
</div>

<footer>
    © Greg u.
</footer>

<script>
    const audioBase = "https://ohaveitsion.github.io/Jerusalem/Audios/";
    let isStam = false;
    let currentParasha = "";
    let currentLang = 'fr';

    const translations = {
        fr: {
            title: "Maftir & Haftara",
            placeholder: "-- Sélectionner une Parasha --",
            houl: "H'oul",
            israel: "Israël",
            modeTorah: "Mode Torah",
            loading: "Chargement du texte ...",
            searching: "Recherche de l'enregistrement...",
            coming: "Audio à venir ...",
            error: "Erreur de connexion.",
            audioErr: "Erreur audio.",
            books: ["Genèse", "Exode", "Lévitique", "Nombres", "Deutéronome"]
        },
        he: {
            title: "מפטir והפטרה",
            placeholder: "-- בחר פרשה --",
            houl: "חו''ל",
            israel: "ישראל",
            modeTorah: "מצב תורה",
            loading: "טוען טקסט...",
            searching: "מחפש הקלטה...",
            coming: "אודיו בקרוב...",
            error: "שגיאת התחברות.",
            audioErr: "שגיאת אודיו.",
            books: ["בראשית", "שמות", "ויקרא", "במדבר", "דברים"]
        }
    };

    const torahBooksData = {
        "Bereshit": ["Bereshit", "Noach", "Lech-Lecha", "Vayera", "Chayei Sara", "Toldot", "Vayetzei", "Vayishlach", "Vayeshev", "Miketz", "Vayigash", "Vayechi"],
        "Shemot": ["Shemot", "Vaera", "Bo", "Beshalach", "Yitro", "Mishpatim", "Terumah", "Tetzaveh", "Ki Tissa", "Vayakhel", "Pekudei"],
        "Vayikra": ["Vayikra", "Tzav", "Shmini", "Tazria", "Metzora", "Achrei Mot", "Kedoshim", "Emor", "Behar", "Bechukotai"],
        "Bemidbar": ["Bemidbar", "Nasso", "Beha'alotcha", "Shelach", "Korach", "Chukat", "Balak", "Pinchas", "Matot", "Masei"],
        "Devarim": ["Devarim", "Vaetchanan", "Eikev", "Re'eh", "Shoftim", "Ki Teitzei", "Ki Tavo", "Nitzavim", "Vayeilech", "Ha'Azinu", "V'Zot HaBerachah"]
    };

    const maftirRefs = {
        "Bereshit": "Genesis 6:5-6:8", "Noach": "Genesis 11:29-11:32", "Lech-Lecha": "Genesis 17:24-17:27", "Vayera": "Genesis 22:20-22:24", "Chayei Sara": "Genesis 25:16-25:18", "Toldot": "Genesis 28:5-28:9", "Vayetzei": "Genesis 31:55-32:3", "Vayishlach": "Genesis 36:40-36:43", "Vayeshev": "Genesis 40:20-40:23", "Miketz": "Genesis 44:14-44:17", "Vayigash": "Genesis 47:24-47:27", "Vayechi": "Genesis 50:23-50:26",
        "Shemot": "Exodus 5:22-6:1", "Vaera": "Exodus 9:30-9:35", "Bo": "Exodus 13:14-13:16", "Beshalach": "Exodus 17:14-17:16", "Yitro": "Exodus 20:19-20:23", "Mishpatim": "Exodus 24:15-24:18", "Terumah": "Exodus 27:17-27:19", "Tetzaveh": "Exodus 30:8-30:10", "Ki Tissa": "Exodus 34:30-34:35", "Vayakhel": "Exodus 38:18-38:20", "Pekudei": "Exodus 40:34-40:38",
        "Vayikra": "Leviticus 5:24-5:26", "Tzav": "Leviticus 8:33-8:36", "Shmini": "Leviticus 11:44-11:47", "Tazria": "Leviticus 13:57-13:59", "Metzora": "Leviticus 15:31-15:33", "Achrei Mot": "Leviticus 18:24-18:30", "Kedoshim": "Leviticus 20:25-20:27", "Emor": "Leviticus 24:21-24:23", "Behar": "Leviticus 25:53-26:2", "Bechukotai": "Leviticus 27:32-27:34",
        "Bemidbar": "Numbers 4:17-4:20", "Nasso": "Numbers 7:87-7:89", "Beha'alotcha": "Numbers 12:14-12:16", "Shelach": "Numbers 15:37-15:41", "Korach": "Numbers 18:30-18:32", "Chukat": "Numbers 21:34-22:1", "Balak": "Numbers 25:7-25:9", "Pinchas": "Numbers 29:35-30:1", "Matot": "Numbers 32:39-32:42", "Masei": "Numbers 36:10-36:13",
        "Devarim": "Deuteronomy 3:18-3:22", "Vaetchanan": "Deuteronomy 7:7-7:11", "Eikev": "Deuteronomy 11:22-11:25", "Re'eh": "Deuteronomy 16:13-16:17", "Shoftim": "Deuteronomy 21:7-21:9", "Ki Teitzei": "Deuteronomy 25:17-25:19", "Ki Tavo": "Deuteronomy 29:6-29:8", "Nitzavim": "Deuteronomy 30:15-30:20", "Vayeilech": "Deuteronomy 31:28-31:30", "Ha'Azinu": "Deuteronomy 32:48-32:52", "V'Zot HaBerachah": "Deuteronomy 34:10-34:12"
    };

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.lang-btn[onclick="setLanguage('${lang}')"]`).classList.add('active');
        
        const t = translations[lang];
        document.getElementById('ui-title').innerText = t.title;
        document.getElementById('ui-select-placeholder').innerText = t.placeholder;
        document.getElementById('ui-houl').innerText = t.houl;
        document.getElementById('ui-israel').innerText = t.israel;
        document.getElementById('mode-btn').innerText = t.modeTorah;
        
        initSelect();
        if (currentParasha) loadTexts(currentParasha);
    }

    function initSelect() {
        const sel = document.getElementById('parasha-select');
        const savedVal = sel.value;
        sel.innerHTML = `<option value="">${translations[currentLang].placeholder}</option>`;
        
        const bookKeys = Object.keys(torahBooksData);
        bookKeys.forEach((key, index) => {
            const group = document.createElement('optgroup');
            group.label = translations[currentLang].books[index];
            torahBooksData[key].forEach(p => {
                let opt = document.createElement('option');
                opt.value = p;
                opt.text = p;
                group.appendChild(opt);
            });
            sel.appendChild(group);
        });
        sel.value = savedVal;
    }

    async function loadTexts(pName) {
        currentParasha = pName;
        const isIsrael = document.getElementById('israel-toggle').checked ? 1 : 0;
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');
        const t = translations[currentLang];
        
        loader.innerText = t.loading;
        loader.classList.remove('hidden');
        content.classList.add('hidden');

        try {
            const calUrl = `https://www.sefaria.org/api/calendars?parasha=${pName}&israel=${isIsrael}`;
            const calRes = await fetch(calUrl).then(r => r.json());
            
            const hItem = calRes.calendar_items.find(i => i.title.en.includes("Haftara"));
            const hRef = hItem ? hItem.ref : null;
            const mRef = maftirRefs[pName];

            const [mRes, hRes] = await Promise.all([
                fetch(`https://www.sefaria.org/api/texts/${mRef}?context=0`).then(r => r.json()),
                hRef ? fetch(`https://www.sefaria.org/api/texts/${hRef}?context=0`).then(r => r.json()) : {he: "Haftara non disponible."}
            ]);

            document.getElementById('maftir-ref-title').innerText = `Maftir (${mRef})`;
            document.getElementById('haftara-ref-title').innerText = `Haftara (${hRef || '?'})`;
            
            render(mRes.he, hRes.he);
            handleAudio(pName);

        } catch (err) {
            loader.innerText = t.error;
        }
    }

    function render(mHe, hHe) {
        const clean = (input) => {
            if (!input) return "";
            let txt = Array.isArray(input) ? input.flat(Infinity).join(' ') : input;
            if (isStam) txt = txt.replace(/[\u0591-\u05C7]/g, "");
            return txt;
        };
        document.getElementById('maftir-text').innerHTML = clean(mHe);
        document.getElementById('haftara-text').innerHTML = clean(hHe);
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
    }

    function handleAudio(name) {
        const zone = document.getElementById('audio-zone');
        const ctrl = document.getElementById('audio-ctrl');
        const status = document.getElementById('audio-status');
        const t = translations[currentLang];
        const url = `${audioBase}${encodeURIComponent(name)}.mp3`;

        zone.classList.remove('hidden');
        status.innerText = t.searching;
        ctrl.classList.add('hidden');

        fetch(url, { method: 'HEAD' }).then(res => {
            if (res.ok) {
                ctrl.src = url;
                ctrl.classList.remove('hidden');
                status.innerText = "";
            } else {
                status.innerText = t.coming;
            }
        }).catch(() => { status.innerText = t.audioErr; });
    }

    function manualSelect() {
        const val = document.getElementById('parasha-select').value;
        if (val) loadTexts(val);
    }

    function toggleStam() {
        isStam = !isStam;
        document.getElementById('mode-btn').classList.toggle('active');
        if (currentParasha) loadTexts(currentParasha);
    }

    window.onload = () => setLanguage('fr');
</script>
</body>
</html>
