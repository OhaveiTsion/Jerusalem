<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision Maftir & Haftara</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background: #f4f7f6; direction: rtl; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: var(--primary); direction: ltr; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; direction: ltr; background: #eee; padding: 10px; border-radius: 8px; }
        .text-box { margin-top: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .hebrew-text { font-size: 24px; margin-bottom: 20px; line-height: 1.8; }
        .stam-text { font-family: 'Times New Roman', serif; font-weight: bold; } /* À remplacer par webfont STAM plus tard */
        .audio-player { margin-top: 20px; text-align: center; direction: ltr; padding: 15px; background: #f9f9f9; border-radius: 8px; }
        .hidden { display: none; }
        .toggle-btn { cursor: pointer; padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="parasha-title">Chargement...</h1>
    
    <div class="controls">
        <label>
            <input type="checkbox" id="location-toggle"> Mode Israël
        </label>
        <button class="toggle-btn" onclick="toggleTextMode()">Mode Torah (Sans Voyelles)</button>
    </div>

    <div id="audio-container" class="audio-player">
        <p id="audio-status">Vérification de l'audio...</p>
        <audio id="player" controls class="hidden"></audio>
    </div>

    <div class="text-box">
        <h2>Maftir</h2>
        <div id="maftir-text" class="hebrew-text"></div>
        <hr>
        <h2>Haftara</h2>
        <div id="haftara-text" class="hebrew-text"></div>
    </div>
</div>

<script>
    // Configuration
    const GITHUB_USER = "TON_PSEUDO"; // À REMPLACER
    const GITHUB_REPO = "TON_REPO";   // À REMPLACER
    const AUDIO_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/Audios/`;
    
    // Mapping basé sur ton image
    const parashaMapping = {
        "Emor": { sefaria: "Emor", display: "Emor" },
        "Behar": { sefaria: "Behar", display: "Behar" },
        // ... je compléterai la liste entière ici
    };

    let isStamMode = false;

    async function init() {
        const isIsrael = document.getElementById('location-toggle').checked;
        // 1. Récupérer la parasha via Hebcal
        const response = await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&israel=${isIsrael ? 'on' : 'off'}&maj=on&min=on&mod=on&nx=on&year=now&month=now`);
        const data = await response.json();
        
        // Logique pour trouver la parasha de la semaine...
        // Pour le test, on force sur Emor
        loadParasha("Emor");
    }

    async function loadParasha(name) {
        document.getElementById('parasha-title').innerText = name;
        
        // 2. Texte via Sefaria
        // Exemple simplifié : Maftir de Emor (Vayikra 24:20-23 par exemple)
        const resMaftir = await fetch(`https://www.sefaria.org/api/texts/Leviticus.24.20-23`);
        const dataMaftir = await resMaftir.json();
        renderText(dataMaftir.he, 'maftir-text');

        // 3. Vérifier Audio
        checkAudio(name);
    }

    function checkAudio(name) {
        const audioUrl = `${AUDIO_BASE_URL}${name}.mp3`;
        const player = document.getElementById('player');
        const status = document.getElementById('audio-status');

        fetch(audioUrl, { method: 'HEAD' })
            .then(res => {
                if(res.ok) {
                    player.src = audioUrl;
                    player.classList.remove('hidden');
                    status.classList.add('hidden');
                } else {
                    status.innerText = "(Audio à venir ...)";
                    player.classList.add('hidden');
                }
            });
    }

    function renderText(lines, elementId) {
        const container = document.getElementById(elementId);
        // Nettoyage si mode Torah (regex pour enlever les taamim et nekudot)
        let text = lines.join(' ');
        if(isStamMode) {
            text = text.replace(/[\u0591-\u05C7]/g, ""); 
        }
        container.innerHTML = text;
    }

    function toggleTextMode() {
        isStamMode = !isStamMode;
        init(); // Recharge avec le nouveau mode
    }

    document.getElementById('location-toggle').addEventListener('change', init);
    init();
</script>

</body>
</html>
