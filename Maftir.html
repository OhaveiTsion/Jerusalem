<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision Maftir & Haftara - Jérusalem</title>
    <style>
        :root { --primary: #2c3e50; --accent: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; direction: rtl; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; direction: ltr; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; direction: ltr; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        select, .btn { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; background: white; }
        .btn.active { background: var(--primary); color: white; }
        .hebrew-text { font-size: 28px; line-height: 2; margin-top: 15px; text-align: right; font-family: "Times New Roman", serif; }
        .audio-player { background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; direction: ltr; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        audio { width: 100%; }
        .hidden { display: none; }
        .welcome-msg { text-align: center; color: #7f8c8d; padding: 40px; direction: ltr; }
        h2 { direction: ltr; text-align: right; color: var(--accent); border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="display-title">Révision Maftir</h1>
</div>

<div class="container">
    <div class="controls-row">
        <select id="parasha-select" onchange="manualSelect()">
            <option value="">-- Sélectionner --</option>
        </select>
        <div style="display:flex; align-items:center; gap:8px;">
            <span>H'oul</span>
            <label class="switch">
                <input type="checkbox" id="israel-toggle" checked onchange="buildMenu()">
                <span class="slider"></span>
            </label>
            <span>Israël</span>
        </div>
        <button id="mode-btn" class="btn" onclick="toggleStam()">Mode Torah</button>
    </div>

    <div id="audio-zone" class="audio-player hidden">
        <div id="audio-status">Recherche audio...</div>
        <audio id="audio-ctrl" controls class="hidden"></audio>
    </div>

    <div id="welcome-screen" class="welcome-msg">
        <h3>Prêt pour la révision</h3>
        <p>Sélectionnez une Parasha pour charger automatiquement les textes de Sefaria et l'audio correspondant.</p>
    </div>

    <div id="loader" class="hidden" style="text-align:center; padding: 20px;">
        <p>Chargement des API (Hebcal & Sefaria)...</p>
    </div>
    
    <div id="content" class="hidden">
        <div id="maftir-section">
            <h2>Maftir</h2>
            <div id="maftir-text" class="hebrew-text"></div>
        </div>
        <div id="haftara-section" style="margin-top:40px;">
            <h2 id="haftara-title">Haftara</h2>
            <div id="haftara-text" class="hebrew-text"></div>
        </div>
    </div>
</div>

<script>
    const maftirRefs = {
        "Bereshit": "Genesis 6:5-6:8", "Noach": "Genesis 11:29-11:32", "Lech-Lecha": "Genesis 17:24-17:27", "Vayera": "Genesis 22:20-22:24", "Chayei Sara": "Genesis 25:16-25:18", "Toldot": "Genesis 28:5-28:9", "Vayetzei": "Genesis 31:55-32:3", "Vayishlach": "Genesis 36:40-36:43", "Vayeshev": "Genesis 40:20-40:23", "Miketz": "Genesis 44:14-44:17", "Vayigash": "Genesis 47:24-47:27", "Vayechi": "Genesis 50:23-50:26",
        "Shemot": "Exodus 5:22-6:1", "Vaera": "Exodus 9:30-9:35", "Bo": "Exodus 13:14-13:16", "Beshalach": "Exodus 17:14-17:16", "Yitro": "Exodus 20:19-20:23", "Mishpatim": "Exodus 24:15-24:18", "Terumah": "Exodus 27:17-27:19", "Tetzaveh": "Exodus 30:8-30:10", "Ki Tissa": "Exodus 34:30-34:35", "Vayakhel": "Exodus 38:18-38:20", "Pekudei": "Exodus 40:34-40:38",
        "Vayikra": "Leviticus 5:24-5:26", "Tzav": "Leviticus 8:33-8:36", "Shmini": "Leviticus 11:44-11:47", "Tazria": "Leviticus 13:57-13:59", "Metzora": "Leviticus 15:31-15:33", "Achrei Mot": "Leviticus 18:24-18:30", "Kedoshim": "Leviticus 20:25-20:27", "Emor": "Leviticus 24:21-24:23", "Behar": "Leviticus 25:53-26:2", "Bechukotai": "Leviticus 27:32-27:34",
        "Bemidbar": "Numbers 4:17-4:20", "Nasso": "Numbers 7:87-7:89", "Beha'alotcha": "Numbers 12:14-12:16", "Shelach": "Numbers 15:37-15:41", "Korach": "Numbers 18:30-18:32", "Chukat": "Numbers 21:34-22:1", "Balak": "Numbers 25:7-25:9", "Pinchas": "Numbers 29:35-30:1", "Matot": "Numbers 32:39-32:42", "Masei": "Numbers 36:10-36:13",
        "Devarim": "Deuteronomy 3:18-3:22", "Vaetchanan": "Deuteronomy 7:7-7:11", "Eikev": "Deuteronomy 11:22-11:25", "Re'eh": "Deuteronomy 16:13-16:17", "Shoftim": "Deuteronomy 21:7-21:9", "Ki Teitzei": "Deuteronomy 25:17-25:19", "Ki Tavo": "Deuteronomy 29:6-29:8", "Nitzavim": "Deuteronomy 30:15-30:20", "Vayeilech": "Deuteronomy 31:28-31:30", "Ha'Azinu": "Deuteronomy 32:48-32:52", "V'Zot HaBerachah": "Deuteronomy 34:10-34:12"
    };

    const torahBooks = {
        "Bereshit": ["Bereshit", "Noach", "Lech-Lecha", "Vayera", "Chayei Sara", "Toldot", "Vayetzei", "Vayishlach", "Vayeshev", "Miketz", "Vayigash", "Vayechi"],
        "Shemot": ["Shemot", "Vaera", "Bo", "Beshalach", "Yitro", "Mishpatim", "Terumah", "Tetzaveh", "Ki Tissa", "Vayakhel", "Pekudei"],
        "Vayikra": ["Vayikra", "Tzav", "Shmini", "Tazria", "Metzora", "Achrei Mot", "Kedoshim", "Emor", "Behar", "Bechukotai"],
        "Bemidbar": ["Bemidbar", "Nasso", "Beha'alotcha", "Shelach", "Korach", "Chukat", "Balak", "Pinchas", "Matot", "Masei"],
        "Devarim": ["Devarim", "Vaetchanan", "Eikev", "Re'eh", "Shoftim", "Ki Teitzei", "Ki Tavo", "Nitzavim", "Vayeilech", "Ha'Azinu", "V'Zot HaBerachah"]
    };

    const nameMap = {
        "Bereshit": "Bereshit", "Noach": "Noah", "Lech-Lecha": "Leh-Leha", "Vayera": "Vayera", "Chayei Sara": "Hayei Sara", "Toldot": "Toldot", "Vayetzei": "Vayetzei", "Vayishlach": "Vayishlah", "Vayeshev": "Vayeshev", "Miketz": "Miketz", "Vayigash": "Vayigash", "Vayechi": "Vayehi", "Shemot": "Shemot", "Vaera": "Vaera", "Bo": "Bo", "Beshalach": "Beshalah", "Yitro": "Yitro", "Mishpatim": "Mishpatim", "Terumah": "Terumah", "Tetzaveh": "Tetzaveh", "Ki Tissa": "Ki Tissa", "Vayakhel": "Vayakhel", "Pekudei": "Pekudei", "Vayikra": "Vayikra", "Tzav": "Tzav", "Shmini": "Shmini", "Tazria": "Tazria", "Metzora": "Metzora", "Achrei Mot": "Ahrei Mot", "Kedoshim": "Kedoshim", "Emor": "Emor", "Behar": "Behar", "Bechukotai": "Behoukotai", "Bemidbar": "Bemidbar", "Nasso": "Nasso", "Beha'alotcha": "Behaalotha", "Shelach": "Shelah", "Korach": "Korah", "Chukat": "Houkat", "Balak": "Balak", "Pinchas": "Pinhas", "Matot": "Matot", "Masei": "Masei", "Devarim": "Devarim", "Vaetchanan": "Vaethanan", "Eikev": "Eikev", "Re'eh": "Reeh", "Shoftim": "Shoftim", "Ki Teitzei": "Ki-Teitzei", "Ki Tavo": "Ki-Tavo", "Nitzavim": "Nitzavim", "Vayeilech": "Vayeilech", "Ha'Azinu": "Haazinou", "V'Zot HaBerachah": "Vezot-Haberaha"
    };

    let isStam = false;
    let currentEnName = "";
    const audioPath = "https://ohaveitsion.github.io/Jerusalem/Audios/";

    function buildMenu() {
        const select = document.getElementById('parasha-select');
        select.innerHTML = '<option value="">-- Sélectionner --</option>';
        for (const [book, parashiot] of Object.entries(torahBooks)) {
            let group = document.createElement('optgroup');
            group.label = book;
            parashiot.forEach(en => {
                let opt = document.createElement('option');
                opt.value = en;
                opt.text = nameMap[en] || en;
                group.appendChild(opt);
            });
            select.add(group);
        }
    }

    function manualSelect() {
        const val = document.getElementById('parasha-select').value;
        if(val) {
            document.getElementById('welcome-screen').classList.add('hidden');
            loadData(val);
        } else {
            resetView();
        }
    }

    function resetView() {
        document.getElementById('welcome-screen').classList.remove('hidden');
        document.getElementById('content').classList.add('hidden');
        document.getElementById('audio-zone').classList.add('hidden');
        document.getElementById('display-title').innerText = "Révision Maftir";
    }

    async function loadData(enName) {
        currentEnName = enName;
        const frName = nameMap[enName] || enName;
        const isIsrael = document.getElementById('israel-toggle').checked;
        
        document.getElementById('display-title').innerText = "Parashat " + frName;
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('content').classList.add('hidden');
        document.getElementById('audio-zone').classList.remove('hidden');

        try {
            // 1. Appel API Hebcal pour trouver la Haftara exacte associée à ce nom de Parasha
            // On utilise l'endpoint shabbat qui contient les correspondances Maftir/Haftara
            const hebcalRes = await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&israel=${isIsrael?'on':'off'}&maj=on&year=now`);
            const hebcalData = await hebcalRes.json();
            
            // On cherche l'item de type 'parashat' qui correspond à notre sélection
            // Note: Hebcal utilise parfois "Achrei Mot" ou "Ahrei Mot", on gère les deux.
            const pMatch = hebcalData.items.find(i => 
                i.category === "parashat" && 
                (i.title.includes(enName) || (enName === "Achrei Mot" && i.title.includes("Ahrei")))
            );

            let haftaraRef = pMatch?.haftara; // Récupère la réf type "Ezekiel 44:1-31"
            const maftirRef = maftirRefs[enName];

            // 2. Récupération des textes sur Sefaria
            const [mRes, hRes] = await Promise.all([
                fetch(`https://www.sefaria.org/api/texts/${maftirRef}?context=0`).then(r => r.json()),
                haftaraRef ? fetch(`https://www.sefaria.org/api/texts/${haftaraRef}?context=0`).then(r => r.json()) : Promise.resolve(null)
            ]);

            document.getElementById('haftara-title').innerText = haftaraRef ? `Haftara (${haftaraRef})` : "Haftara";
            display(mRes.he, hRes ? hRes.he : null);
            checkAudio(frName);
            
        } catch (e) { 
            console.error("API Error:", e);
            document.getElementById('loader').innerText = "Erreur de connexion aux API.";
        }
    }

    function display(m, h) {
        const clean = (t) => {
            if (!t) return "";
            let txt = Array.isArray(t) ? t.join(' ') : t;
            if(isStam) txt = txt.replace(/[\u0591-\u05C7]/g, ""); 
            return txt;
        };
        document.getElementById('maftir-text').innerHTML = clean(m);
        document.getElementById('haftara-text').innerHTML = h ? clean(h) : "Haftara non disponible via API pour cette sélection.";
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
    }

    function checkAudio(name) {
        const ctrl = document.getElementById('audio-ctrl');
        const status = document.getElementById('audio-status');
        const urlMp3 = `${audioPath}${encodeURIComponent(name)}.mp3`;
        
        ctrl.classList.add('hidden');
        status.classList.remove('hidden');
        status.innerText = "Recherche audio...";

        fetch(urlMp3, { method: 'HEAD' }).then(res => {
            if (res.ok) {
                ctrl.src = urlMp3;
                ctrl.classList.remove('hidden');
                status.classList.add('hidden');
            } else {
                status.innerText = "Audio non disponible.";
            }
        }).catch(() => { status.innerText = "Erreur audio."; });
    }

    function toggleStam() {
        isStam = !isStam;
        document.getElementById('mode-btn').classList.toggle('active');
        if(currentEnName) loadData(currentEnName);
    }

    window.onload = buildMenu;
</script>
</body>
</html>
