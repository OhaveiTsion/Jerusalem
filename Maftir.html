<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maftir & Haftara</title>
    
    <style>
        /* SOURCE FIABLE : Police Stam (Style Scribe) */
        @font-face {
            font-family: 'KtavVellish';
            src: url('https://cdn.jsdelivr.net/gh/scisneromam/stam-font/StamAshkenaz.ttf') format('truetype');
            font-display: swap;
        }

        :root { --primary: #2c3e50; --accent: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #eaeff2; direction: ltr; }

        .container { max-width: 900px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; }
        
        /* Style par défaut (avec voyelles) */
        .hebrew-text { 
            font-size: 30px; 
            line-height: 2; 
            text-align: right; 
            direction: rtl; 
            font-family: "SBL Hebrew", "Times New Roman", serif;
        }

        /* FORCE LA POLICE QUAND LE MODE TORAH EST ACTIF */
        .hebrew-text.stam-mode {
            font-family: 'KtavVellish', serif !important;
            font-size: 45px !important; /* On augmente la taille pour la lisibilité */
            line-height: 1.5 !important;
            color: #000;
        }

        .controls { text-align: center; margin-bottom: 20px; }
        .btn { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; }
        .btn.active { background: var(--primary); color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <select id="parasha-select" onchange="loadParasha()">
            <option value="">-- Sélectionner --</option>
            <option value="Bereshit">Bereshit</option>
            <option value="Noach">Noach</option>
            <!-- Ajoute les autres parashiot ici -->
        </select>
        <button id="mode-btn" class="btn" onclick="toggleStam()">Mode Torah</button>
    </div>

    <div id="content" class="hidden">
        <div id="maftir-text" class="hebrew-text"></div>
        <hr>
        <div id="haftara-text" class="hebrew-text"></div>
    </div>
</div>

<script>
    let isStam = false;
    let currentData = { maftir: "", haftara: "" };

    async function loadParasha() {
        const p = document.getElementById('parasha-select').value;
        if (!p) return;

        // Simulation d'appel API Sefaria (simplifié pour l'exemple)
        // Dans ton code complet, garde ta logique fetch actuelle
        const resM = await fetch(`https://www.sefaria.org/api/texts/Genesis.1.1?context=0`).then(r => r.json());
        currentData.maftir = resM.he;
        
        document.getElementById('content').classList.remove('hidden');
        render();
    }

    function toggleStam() {
        isStam = !isStam;
        document.getElementById('mode-btn').classList.toggle('active');
        
        // On applique/retire la classe sur les conteneurs de texte
        document.getElementById('maftir-text').classList.toggle('stam-mode', isStam);
        document.getElementById('haftara-text').classList.toggle('stam-mode', isStam);
        
        render();
    }

    function render() {
        const clean = (txt) => {
            if (typeof txt !== 'string') txt = txt.join(' ');
            // Si mode Stam, on retire les voyelles (Nikoud) et signes de cantillation
            return isStam ? txt.replace(/[\u0591-\u05C7]/g, "") : txt;
        };

        document.getElementById('maftir-text').innerHTML = clean(currentData.maftir);
        document.getElementById('haftara-text').innerHTML = "Texte Haftara ici...";
    }
</script>

</body>
</html>
