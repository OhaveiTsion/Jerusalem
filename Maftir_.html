            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        .controls {
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .content {
            font-size: 24px;
            line-height: 1.8;
            padding: 20px;
            border: 1px dashed #ddd;
            min-height: 200px;
            text-align: justify;
        }

        /* 3. Classe qui active la police spécifique */
        .stam {
            font-family: 'MaPoliceTorah', serif !important;
            font-size: 32px; /* Un peu plus grand pour la lisibilité */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lecteur de texte hébreu</h1>

        <div class="controls">
            <button onclick="toggleStam()">Basculer Mode Torah (Stam)</button>
        </div>

        <div id="hebrew-display" class="content">
            בראשית ברא אלהים את השמים ואת הארץ. והארץ היתה תהו ובהו וחשך על פני תהום ורוח אלהים מרחפת על פני המים. ויאמר אלהים יהי אור ויהי אור.
        </div>
    </div>

    <script>
        /**
         * Fonction pour basculer la classe .stam sur l'élément d'affichage
         */
        function toggleStam() {
            const element = document.getElementById('hebrew-display');
            element.classList.toggle('stam');
            
            // Petit message console pour déboguer
            if (element.classList.contains('stam')) {
                console.log("Mode Torah activé");
            } else {
                console.log("Mode Classique activé");
            }
        }
    </script>

</body>
</html>
