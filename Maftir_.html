<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232c3e50'/%3E%3Cpath d='M30 20v60M70 20v60' stroke='%23d4af37' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M30 30h40M30 70h40' stroke='%23d4af37' stroke-width='12'/%3E%3C/svg%3E">
    <title>Maftir & Haftara</title>
    
    <style>
    /* 1. DÉCLARATION DE LA POLICE AVEC CHEMIN ABSOLU SI POSSIBLE */
    @font-face {
        font-family: 'TorahFont';
        /* Si le fichier est au même niveau que le HTML */
        src: url('./TORAH.TTF') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    :root { --primary: #2c3e50; --accent: #d4af37; --light: #f8f9fa; }
    body { font-family: 'Segoe UI', sans-serif; background: #eaeff2; margin: 0; }

    /* 2. STYLE ULTRA-PRIORITAIRE POUR LE MODE TORAH */
    /* On utilise l'ID pour être sûr que ça gagne sur les autres styles */
    #maftir-text.torah-mode-active, 
    #haftara-text.torah-mode-active {
        font-family: 'TorahFont', Arial, serif !important;
        font-size: 50px !important; /* Taille augmentée pour la lisibilité */
        line-height: 1.6 !important;
        direction: rtl;
        text-align: right;
        letter-spacing: 2px;
    }

    .hebrew-text { font-size: 34px; line-height: 2.3; margin-top: 20px; text-align: right; font-family: "SBL Hebrew", serif; white-space: pre-wrap; direction: rtl; }
    /* ... (le reste de ton CSS) ... */
</style>

<script>
    // ... (tes variables et fonctions de chargement) ...

    function render(mHe, hHe) {
        const mEl = document.getElementById('maftir-text');
        const hEl = document.getElementById('haftara-text');

        const processText = (input) => {
            if (!input) return "";
            let txt = Array.isArray(input) ? input.flat(Infinity).join(' ') : input;
            
            if (isStam) {
                // On enlève strictement TOUT ce qui n'est pas une lettre hébraïque
                // (Enlève les points, traits, accents massorétiques)
                txt = txt.replace(/[\u0591-\u05C7]/g, ""); 
                
                mEl.classList.add('torah-mode-active');
                hEl.classList.add('torah-mode-active');
            } else {
                mEl.classList.remove('torah-mode-active');
                hEl.classList.remove('torah-mode-active');
            }
            return txt;
        };

        mEl.innerHTML = processText(mHe);
        hEl.innerHTML = processText(hHe);

        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
    }
</script>

</head>
<body>

<div class="header">
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('fr')">FR</button>
        <button class="lang-btn" onclick="setLanguage('he')">עב</button>
    </div>
    <h1 id="ui-title">Maftir & Haftara</h1>
</div>

<div class="container">
    <div class="controls-row">
        <select id="parasha-select" onchange="manualSelect()"></select>
        <button id="mode-btn" class="btn" onclick="toggleStam()">Mode Torah</button>
    </div>

    <div id="welcome-screen">
        <span class="welcome-icon">📜</span>
        <h2 id="ui-welcome-title">Bienvenue</h2>
        <p id="ui-welcome-text">Veuillez sélectionner une Parasha pour commencer.</p>
    </div>

    <div id="audio-zone" class="audio-player hidden">
        <audio id="audio-ctrl" controls controlsList="nodownload"></audio>
        <div id="audio-status"></div>
    </div>

    <div id="loader" class="hidden" style="text-align: center; padding: 40px; font-style: italic; color: #666;"></div>

    <div id="content" class="hidden">
        <div id="maftir-section">
            <h2 id="maftir-ref-title" class="section-title"></h2>
            <div id="maftir-text" class="hebrew-text"></div>
        </div>
        <div id="haftara-section">
            <h2 id="haftara-ref-title" class="section-title"></h2>
            <div id="haftara-text" class="hebrew-text"></div>
        </div>
    </div>
</div>

<footer>© Greg u.</footer>

<script>
    const audioBase = "https://ohaveitsion.github.io/Jerusalem/Audios/";
    let isStam = false;
    let currentParasha = "";
    let currentLang = 'fr';

    const translations = {

            title: "Maftir & Haftara", placeholder: "-- Sélectionner une Parasha --",

            loading: "Chargement du texte...", searching: "Recherche de l'enregistrement...",
            coming: "Audio à venir...", error: "Erreur de connexion.", audioErr: "Erreur audio.",
            maftir: "Maftir", haftara: "Haftara",
            books: ["Béréchit", "Chémot", "Vaykra", "Bamidbar", "Déverïm"],
            pNames: {
                "Bereshit": "Bereshit", "Noach": "Noach", "Lech-Lecha": "Lech-Lecha", "Vayera": "Vayera", "Chayei Sara": "Chayei Sara", "Toldot": "Toldot", "Vayetzei": "Vayetzei", "Vayishlach": "Vayishlach", "Vayeshev": "Vayeshev", "Miketz": "Miketz", "Vayigash": "Vayigash", "Vayechi": "Vayechi",
                "Shemot": "Shemot", "Vaera": "Vaera", "Bo": "Bo", "Beshalach": "Beshalach", "Yitro": "Yitro", "Mishpatim": "Mishpatim", "Terumah": "Terumah", "Tetzaveh": "Tetzaveh", "Ki Tissa": "Ki Tissa", "Vayakhel": "Vayakhel", "Pekudei": "Pekudei",
                "Vayikra": "Vayikra", "Tzav": "Tzav", "Shmini": "Shmini", "Tazria": "Tazria", "Metzora": "Metzora", "Achrei Mot": "Achrei Mot", "Kedoshim": "Kedoshim", "Emor": "Emor", "Behar": "Behar", "Bechukotai": "Bechukotai",
                "Bemidbar": "Bemidbar", "Nasso": "Nasso", "Beha'alotcha": "Beha'alotcha", "Shelach": "Shelach", "Korach": "Korach", "Chukat": "Chukat", "Balak": "Balak", "Pinchas": "Pinchas", "Matot": "Matot", "Masei": "Masei",
                "Devarim": "Devarim", "Vaetchanan": "Vaetchanan", "Eikev": "Eikev", "Re'eh": "Re'eh", "Shoftim": "Shoftim", "Ki Teitzei": "Ki Teitzei", "Ki Tavo": "Ki Tavo", "Nitzavim": "Nitzavim", "Vayeilech": "Vayeilech", "Ha'Azinu": "Ha'Azinu", "V'Zot HaBerachah": "V'Zot HaBerachah"
            }
        },
        he: {
            title: "מפטיר והפטרה", placeholder: "-- בחר פרשה --",
            modeTorah: "מצב ספר תורה", welcomeTitle: "ברוכים הבאים", 
            welcomeText: "אנא בחר פרשה כדי להתחיל בלימוד.",
            loading: "טוען טקסט...", searching: "מחפש הקלטה...",
            coming: "אודיו בקרוב...", error: "שגיאת התחברות.", audioErr: "שגיאת אודיו.",
            maftir: "מפטיר", haftara: "הפטרה",
            books: ["בראשית", "שמות", "ויקרא", "במדבר", "דברים"],
            pNames: {
                "Bereshit": "בראשית", "Noach": "נח", "Lech-Lecha": "לך-לך", "Vayera": "וירא", "Chayei Sara": "חיי שרה", "Toldot": "תולדות", "Vayetzei": "ויצא", "Vayishlach": "וישלח", "Vayeshev": "וישב", "Miketz": "מקץ", "Vayigash": "ויגש", "Vayechi": "ויחי",
                "Shemot": "שמות", "Vaera": "וארא", "Bo": "בא", "Beshalach": "בשלח", "Yitro": "יתרו", "Mishpatim": "משפטים", "Terumah": "תרומה", "Tetzaveh": "תצוה", "Ki Tissa": "כי תשא", "Vayakhel": "ויקהל", "Pekudei": "פקודי",
                "Vayikra": "ויקרא", "Tzav": "צו", "Shmini": "שמיני", "Tazria": "תזריע", "Metzora": "מצורע", "Achrei Mot": "אחרי מות", "Kedoshim": "קדושים", "Emor": "אמור", "Behar": "בהר", "Bechukotai": "בחקתי",
                "Bemidbar": "במדבר", "Nasso": "נשא", "Beha'alotcha": "בהעלתך", "Shelach": "שלח לך", "Korach": "קרח", "Chukat": "חקת", "Balak": "בלק", "Pinchas": "פינחס", "Matot": "מטות", "Masei": "מסעי",
                "Devarim": "דברים", "Vaetchanan": "ואתחנן", "Eikev": "עקב", "Re'eh": "ראה", "Shoftim": "שופטים", "Ki Teitzei": "כי תצא", "Ki Tavo": "כי תבוא", "Nitzavim": "נצבים", "Vayeilech": "וילך", "Ha'Azinu": "האזינו", "V'Zot HaBerachah": "וזאת הברכה"
            }
        }
    };

    const torahData = {
        "Bereshit": ["Bereshit", "Noach", "Lech-Lecha", "Vayera", "Chayei Sara", "Toldot", "Vayetzei", "Vayishlach", "Vayeshev", "Miketz", "Vayigash", "Vayechi"],
        "Shemot": ["Shemot", "Vaera", "Bo", "Beshalach", "Yitro", "Mishpatim", "Terumah", "Tetzaveh", "Ki Tissa", "Vayakhel", "Pekudei"],
        "Vayikra": ["Vayikra", "Tzav", "Shmini", "Tazria", "Metzora", "Achrei Mot", "Kedoshim", "Emor", "Behar", "Bechukotai"],
        "Bemidbar": ["Bemidbar", "Nasso", "Beha'alotcha", "Shelach", "Korach", "Chukat", "Balak", "Pinchas", "Matot", "Masei"],
        "Devarim": ["Devarim", "Vaetchanan", "Eikev", "Re'eh", "Shoftim", "Ki Teitzei", "Ki Tavo", "Nitzavim", "Vayeilech", "Ha'Azinu", "V'Zot HaBerachah"]
    };

    const maftirRefs = {
        "Bereshit": "2:1-2:3", "Noach": "11:29-11:32", "Lech-Lecha": "17:24-17:27", "Vayera": "22:20-22:24", "Chayei Sara": "25:16-25:18", "Toldot": "28:7-28:9", "Vayetzei": "32:1-32:3", "Vayishlach": "36:40-36:43", "Vayeshev": "40:20-40:23", "Miketz": "44:14-44:17", "Vayigash": "47:24-47:27", "Vayechi": "50:23-50:26",
        "Shemot": "5:22-6:1", "Vaera": "9:30-9:35", "Bo": "13:14-13:16", "Beshalach": "17:14-17:16", "Yitro": "20:19-20:23", "Mishpatim": "24:15-24:18", "Terumah": "27:17-27:19", "Tetzaveh": "30:8-30:10", "Ki Tissa": "34:33-34:35", "Vayakhel": "38:18-38:20", "Pekudei": "40:34-40:38",
        "Vayikra": "5:24-5:26", "Tzav": "8:33-8:36", "Shmini": "11:45-11:47", "Tazria": "13:57-13:59", "Metzora": "15:31-15:33", "Achrei Mot": "18:24-18:30", "Kedoshim": "20:25-20:27", "Emor": "24:21-24:23", "Behar": "25:53-26:2", "Bechukotai": "27:32-27:34",
        "Bemidbar": "4:17-4:20", "Nasso": "7:87-7:89", "Beha'alotcha": "12:14-12:16", "Shelach": "15:37-15:41", "Korach": "18:30-18:32", "Chukat": "21:34-22:1", "Balak": "25:7-25:9", "Pinchas": "29:35-30:1", "Matot": "32:39-32:42", "Masei": "36:10-36:13",
        "Devarim": "3:18-3:22", "Vaetchanan": "7:7-7:11", "Eikev": "11:22-11:25", "Re'eh": "16:13-16:17", "Shoftim": "21:7-21:9", "Ki Teitzei": "25:17-25:19", "Ki Tavo": "29:6-29:8", "Nitzavim": "30:15-30:20", "Vayeilech": "31:28-31:30", "Ha'Azinu": "32:48-32:52", "V'Zot HaBerachah": "34:10-34:12"
    };

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.lang-btn[onclick*="'${lang}'"]`);
        if(btn) btn.classList.add('active');
        const t = translations[lang];
        document.getElementById('ui-title').innerText = t.title;
        document.getElementById('mode-btn').innerText = t.modeTorah;
        document.getElementById('ui-welcome-title').innerText = t.welcomeTitle;
        document.getElementById('ui-welcome-text').innerText = t.welcomeText;
        initSelect();
        if (currentParasha) loadTexts(currentParasha);
    }

    function initSelect() {
        const sel = document.getElementById('parasha-select');
        const savedVal = sel.value;
        const t = translations[currentLang];
        sel.innerHTML = `<option value="">${t.placeholder}</option>`;
        Object.keys(torahData).forEach((key, idx) => {
            const group = document.createElement('optgroup');
            group.label = t.books[idx];
            torahData[key].forEach(p => {
                let opt = document.createElement('option');
                opt.value = p; opt.text = t.pNames[p];
                group.appendChild(opt);
            });
            sel.appendChild(group);
        });
        sel.value = savedVal;
    }

    async function loadTexts(pName) {
        currentParasha = pName;
        document.getElementById('welcome-screen').classList.add('hidden');
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');
        const t = translations[currentLang];
        loader.innerText = t.loading; loader.classList.remove('hidden'); content.classList.add('hidden');

        try {
            const calUrl = `https://www.sefaria.org/api/calendars?parasha=${pName}&israel=1`;
            const calRes = await fetch(calUrl).then(r => r.json());
            const hItem = calRes.calendar_items.find(i => i.title.en.includes("Haftara"));
            
            let mRef = maftirRefs[pName] || "?";
            let rawHaftaraRef = hItem ? hItem.ref : "?";
            let cleanHaftaraRef = rawHaftaraRef.replace(/[A-Za-z\s]+/, '').trim();

            const [mRes, hRes] = await Promise.all([
                fetch(`https://www.sefaria.org/api/texts/${getSefariaMaftirFullRef(pName)}?context=0`).then(r => r.json()),
                rawHaftaraRef !== "?" ? fetch(`https://www.sefaria.org/api/texts/${rawHaftaraRef}?context=0`).then(r => r.json()) : {he: "Indisponible"}
            ]);

            document.getElementById('maftir-ref-title').innerText = `${t.maftir} (${mRef})`;
            document.getElementById('haftara-ref-title').innerText = `${t.haftara} (${cleanHaftaraRef})`;
            render(mRes.he, hRes.he);
            handleAudio(pName);
        } catch (err) { loader.innerText = t.error; }
    }

    function getSefariaMaftirFullRef(pName) {
        const bookMap = {
            "Bereshit": "Genesis", "Noach": "Genesis", "Lech-Lecha": "Genesis", "Vayera": "Genesis", "Chayei Sara": "Genesis", "Toldot": "Genesis", "Vayetzei": "Genesis", "Vayishlach": "Genesis", "Vayeshev": "Genesis", "Miketz": "Genesis", "Vayigash": "Genesis", "Vayechi": "Genesis",
            "Shemot": "Exodus", "Vaera": "Exodus", "Bo": "Exodus", "Beshalach": "Exodus", "Yitro": "Exodus", "Mishpatim": "Exodus", "Terumah": "Exodus", "Tetzaveh": "Exodus", "Ki Tissa": "Exodus", "Vayakhel": "Exodus", "Pekudei": "Exodus",
            "Vayikra": "Leviticus", "Tzav": "Leviticus", "Shmini": "Leviticus", "Tazria": "Leviticus", "Metzora": "Leviticus", "Achrei Mot": "Leviticus", "Kedoshim": "Leviticus", "Emor": "Leviticus", "Behar": "Leviticus", "Bechukotai": "Leviticus",
            "Bemidbar": "Numbers", "Nasso": "Numbers", "Beha'alotcha": "Numbers", "Shelach": "Numbers", "Korach": "Numbers", "Chukat": "Numbers", "Balak": "Numbers", "Pinchas": "Numbers", "Matot": "Numbers", "Masei": "Numbers",
            "Devarim": "Deuteronomy", "Vaetchanan": "Deuteronomy", "Eikev": "Deuteronomy", "Re'eh": "Deuteronomy", "Shoftim": "Deuteronomy", "Ki Teitzei": "Deuteronomy", "Ki Tavo": "Deuteronomy", "Nitzavim": "Deuteronomy", "Vayeilech": "Deuteronomy", "Ha'Azinu": "Deuteronomy", "V'Zot HaBerachah": "Deuteronomy"
        };
        return `${bookMap[pName]} ${maftirRefs[pName]}`;
    }

    function render(mHe, hHe) {
        const clean = (input) => {
            if (!input) return "";
            let txt = Array.isArray(input) ? input.flat(Infinity).join(' ') : input;
            
            // 3. RETRAVAIL DU TEXTE : On enlève les signes massorétiques (voyelles/accents)
            // car les polices de Torah StAM ne supportent que les lettres de base.
            if (isStam) {
                txt = txt.replace(/[\u0591-\u05C7]/g, ""); 
            }
            return txt;
        };

        const mEl = document.getElementById('maftir-text');
        const hEl = document.getElementById('haftara-text');

        mEl.innerHTML = clean(mHe);
        hEl.innerHTML = clean(hHe);

        // 4. APPLICATION DE LA CLASSE CSS POUR LA POLICE
        if (isStam) {
            mEl.classList.add('torah-mode-active');
            hEl.classList.add('torah-mode-active');
        } else {
            mEl.classList.remove('torah-mode-active');
            hEl.classList.remove('torah-mode-active');
        }

        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
    }

    function handleAudio(name) {
        const zone = document.getElementById('audio-zone');
        const ctrl = document.getElementById('audio-ctrl');
        const status = document.getElementById('audio-status');
        const t = translations[currentLang];
        const url = `${audioBase}${encodeURIComponent(name)}.mp3`;
        zone.classList.remove('hidden'); status.innerText = t.searching; ctrl.classList.add('hidden');
        fetch(url, { method: 'HEAD' }).then(res => {
            if (res.ok) { ctrl.src = url; ctrl.classList.remove('hidden'); status.innerText = ""; }
            else { status.innerText = t.coming; }
        }).catch(() => { status.innerText = t.audioErr; });
    }

    function manualSelect() {
        const val = document.getElementById('parasha-select').value;
        if (val) loadTexts(val);
        else {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById('audio-zone').classList.add('hidden');
        }
    }

    function toggleStam() {
        isStam = !isStam;
        document.getElementById('mode-btn').classList.toggle('active');
        if (currentParasha) loadTexts(currentParasha);
    }

    window.onload = () => setLanguage('fr');
</script>
</body>
</html>
